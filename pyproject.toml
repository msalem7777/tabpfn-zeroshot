[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfn-zeroshot"
version = "0.4.0"
description = "Evidence-guided zero-target-label prediction with optional TabPFN"
requires-python = ">=3.11"
dependencies = ["flask>=3.1,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "pydantic>=2.8,<3", "pypdf>=5,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
tabpfn = ["tabpfn>=9,<10"]
test = ["pytest>=8,<10"]

[project.scripts]
tabpfn-zeroshot = "zeroshot.web:main"

[tool.setuptools.packages.find]
include = ["zeroshot*"]

[tool.setuptools.package-data]
zeroshot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
